version: '3.8'
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "3000"

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/ssl/private:ro
    depends_on:
      - backend
